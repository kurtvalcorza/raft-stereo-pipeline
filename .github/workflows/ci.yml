name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only torch at the pinned version
        run: python -m pip install --upgrade pip && python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned runtime and dev dependencies
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 opt-einsum==3.4.0 opencv-python-headless==5.0.0.93 safetensors==0.8.0 pillow==11.3.0 pytest==8.4.2 ruff==0.16.6
      - name: Install package without re-resolving dependencies
        run: python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests tools
      - name: Unit tests (offline; real upstream architecture with random weights on small rendered pairs, no checkpoint)
        run: pytest
      - name: Validate tutorial, carrier, lock, model card and pin state
        run: python tools/validate_release_assets.py
      - name: Standalone notebook parity (NOTEBOOK_SPEC 2.2 PAR3)
        run: python tools/build_notebook.py --check

  release-evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain evidence boundary
        run: |
          echo "Static/unit CI is not clean-runtime notebook execution evidence."
          echo "The checkpoint is not yet pinned; see docs/release-verification.md before promoting the tutorial."
